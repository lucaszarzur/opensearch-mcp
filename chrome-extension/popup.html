<!DOCTYPE html>
<html>
<head>
<style>
  body { width: 380px; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
  h2 { margin: 0 0 12px; font-size: 15px; color: #00d4ff; }
  .env { display: inline-block; padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-bottom: 10px; }
  .env-qa { background: #2d6a4f; color: #b7e4c7; }
  .env-prod { background: #9d0208; color: #ffccd5; }
  .env-dev { background: #7b2cbf; color: #e0aaff; }
  .env-none { background: #495057; color: #dee2e6; }
  .cookie-box { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 10px; word-break: break-all; max-height: 80px; overflow-y: auto; font-size: 11px; color: #adb5bd; margin: 8px 0; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: all 0.2s; }
  .btn-copy { background: #00d4ff; color: #1a1a2e; }
  .btn-copy:hover { background: #00b4d8; }
  .btn-update { background: #2d6a4f; color: #b7e4c7; }
  .btn-update:hover { background: #40916c; }
  .btn-copy:disabled, .btn-update:disabled { background: #495057; color: #868e96; cursor: not-allowed; }
  .status { margin-top: 8px; padding: 8px; border-radius: 4px; font-size: 12px; display: none; }
  .status-ok { display: block; background: #2d6a4f; color: #b7e4c7; }
  .status-err { display: block; background: #9d0208; color: #ffccd5; }
  .cmd-box { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; color: #00d4ff; margin-top: 8px; word-break: break-all; max-height: 60px; overflow-y: auto; }
  .separator { border-top: 1px solid #0f3460; margin: 12px 0; }
</style>
</head>
<body>
  <h2>OpenSearch Cookie Extractor</h2>
  <div id="envBadge"></div>
  <div id="cookiePreview" class="cookie-box">Navegue para um dashboard OpenSearch...</div>
  <button id="btnCopy" class="btn-copy" disabled>Copiar Cookie</button>
  <button id="btnCopyCmd" class="btn-update" disabled>Copiar Comando de Update</button>
  <div id="status" class="status"></div>
  <div class="separator"></div>
  <div style="font-size:11px;color:#868e96;">
    O comando usa o script <code>update-opensearch-cookie.sh</code><br>
    Cole no terminal para atualizar o ~/.claude.json
  </div>
  <script src="popup.js"></script>
</body>
</html>
